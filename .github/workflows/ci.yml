name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-guard:
    name: Server secrets stay server-side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No server secret exposed via NEXT_PUBLIC_, committed .env, or hard-coded value
        run: |
          if grep -rnE "NEXT_PUBLIC_[A-Z_]*(SECRET|SEARCHAD|HASH|JOB_TOKEN)" \
              --include='*.ts' --include='*.tsx' --include='*.js' --include='*.json' --include='*.yml' \
              frontend backend .github --exclude-dir=node_modules; then
            echo "::error::server secret referenced via NEXT_PUBLIC_"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env(\.local|\.production)?$'; then
            echo "::error::.env file committed"; exit 1
          fi
          if grep -rnE "(NAVER_SEARCHAD|CLICK_HASH|TRACKING_PROXY)[A-Z_]*[[:space:]]*[:=][[:space:]]*['\"][^'\"]{8,}" \
              --include='*.ts' --include='*.tsx' frontend/src backend/src; then
            echo "::error::hard-coded secret value"; exit 1
          fi

  backend:
    name: Backend type-check & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mombridge
          POSTGRES_PASSWORD: mombridge
          POSTGRES_DB: mombridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mombridge -d mombridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://mombridge:mombridge@localhost:5432/mombridge_test
      # schema.prisma의 directUrl용 (마이그레이션 명령이 요구). CI에서는 같은 DB
      DATABASE_URL: postgresql://mombridge:mombridge@localhost:5432/mombridge_test
      DIRECT_URL: postgresql://mombridge:mombridge@localhost:5432/mombridge_test
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Migrations match schema
        run: |
          echo 'CREATE DATABASE mombridge_shadow;' | npx prisma db execute --stdin --url "$TEST_DATABASE_URL"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://mombridge:mombridge@localhost:5432/mombridge_shadow \
            --exit-code
      - run: npm run type-check
      - run: npm test -- --ci

  frontend:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
