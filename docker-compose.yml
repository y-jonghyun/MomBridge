# 로컬 개발·테스트용 PostgreSQL만 띄운다. 운영 배포(Render·Vercel)는 이 파일을 쓰지 않는다.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mombridge_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mombridge_db
      POSTGRES_USER: mombridge_user
      POSTGRES_PASSWORD: mombridge_pass
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mombridge_user -d mombridge_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
