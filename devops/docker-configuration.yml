## 2. Dockerfile.frontend (프론트엔드 - Next.js)

```dockerfile
# =============================================================================
# frontend/Dockerfile.frontend
# Next.js Frontend - Standalone Output 활용 멀티스테이지 빌드
# =============================================================================

# ─────────────────────────────────────────────
# Stage 1: deps — 의존성 레이어 분리
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS deps

RUN apk update && apk upgrade --no-cache && \
    apk add --no-cache libc6-compat

WORKDIR /app

# package 파일 먼저 복사 → 소스 변경 시 캐시 재사용
COPY package.json package-lock.json ./

# 전체 의존성 설치 (Next.js build에 devDeps 필요)
RUN npm ci && npm cache clean --force


# ─────────────────────────────────────────────
# Stage 2: builder — Next.js 빌드
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS builder

WORKDIR /app

# 의존성 가져오기
COPY --from=deps /app/node_modules ./node_modules
COPY . .

# ── 빌드 시 환경 변수 (NEXT_PUBLIC_* 만 번들에 포함됨) ──
ARG NEXT_PUBLIC_API_URL
ARG NEXT_PUBLIC_KAKAO_MAP_KEY

ENV NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} \
    NEXT_PUBLIC_KAKAO_MAP_KEY=${NEXT_PUBLIC_KAKAO_MAP_KEY} \
    # Standalone 모드: 실행에 필요한 파일만 추출
    NEXT_TELEMETRY_DISABLED=1

# next.config.js에 output: 'standalone' 설정 필요
# 이 옵션으로 node_modules 없이 실행 가능한 번들 생성
RUN npm run build && \
    echo "✅ Next.js build completed"


# ─────────────────────────────────────────────
# Stage 3: runner — 경량 실행 이미지
# standalone 출력만 사용해 이미지 크기 대폭 절감
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS runner

LABEL maintainer="hyperlocal-team"
LABEL description="HyperLocal Mission Platform - Frontend"
LABEL version="1.0.0"

RUN apk update && apk upgrade --no-cache && \
    apk add --no-cache \
        dumb-init \
        curl \
        tzdata && \
    cp /usr/share/zoneinfo/Asia/Seoul /etc/localtime && \
    echo "Asia/Seoul" > /etc/timezone && \
    apk del tzdata && \
    rm -rf /var/cache/apk/*

WORKDIR /app

# ── non-root 사용자 생성 ─────────────────────
RUN addgroup \
        --system \
        --gid 1001 \
        nodejs && \
    adduser \
        --system \
        --uid 1001 \
        --ingroup nodejs \
        --no-create-home \
        --shell /bin/false \
        nextjs

# ── Standalone 빌드 결과물 복사 ─────────────
# Next.js standalone: server.js + 최소 node_modules 포함
COPY --from=builder --chown=nextjs:nodejs /app/.next/standalone ./
# 정적 파일 (이미지, CSS, JS chunks)
COPY --from=builder --chown=nextjs:nodejs /app/.next/static ./.next/static
# public 디렉토리 (favicon, 메타 이미지 등)
COPY --from=builder --chown=nextjs:nodejs /app/public ./public

ENV NODE_ENV=production \
    PORT=3000 \
    HOSTNAME="0.0.0.0" \
    NEXT_TELEMETRY_DISABLED=1 \
    TZ=Asia/Seoul

USER nextjs

EXPOSE 3000

HEALTHCHECK \
    --interval=30s \
    --timeout=10s \
    --start-period=40s \
    --retries=3 \
    CMD curl -f http://localhost:3000/api/health || exit 1

# Next.js standalone 진입점
ENTRYPOINT ["dumb-init", "--"]
CMD ["node", "server.js"]
```

