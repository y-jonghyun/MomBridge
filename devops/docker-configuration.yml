## 3. docker-compose.yml (로컬 개발 환경)

```yaml
# =============================================================================
# docker-compose.yml
# 로컬 개발 환경 — Hot Reload + 볼륨 마운트 중심
# 사용법: docker-compose up -d
# =============================================================================

version: "3.9"

# ── 공통 설정 재사용 (YAML 앵커) ─────────────────────────────────────────
x-common-env: &common-env
  TZ: Asia/Seoul

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"   # 로그 파일 최대 크기
    max-file: "3"     # 보관 파일 수

x-restart-policy: &restart-policy
  restart: unless-stopped

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL 데이터베이스 ─────────────────
  postgres:
    image: postgres:16.2-alpine
    container_name: hyperlocal_postgres_dev
    <<: *restart-policy
    environment:
      <<: *common-env
      POSTGRES_DB: hyperlocal_dev
      POSTGRES_USER: hyperlocal_user
      POSTGRES_PASSWORD: dev_password_change_in_prod
      # 성능 튜닝 (개발용)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=ko_KR.UTF-8"
    volumes:
      # 데이터 영속성
      - postgres_data:/var/lib/postgresql/data
      # 초기화 SQL 스크립트 자동 실행
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 개발 시 DB 클라이언트 직접 접속 허용
      - "5432:5432"
    networks:
      - hyperlocal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperlocal_user -d hyperlocal_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ── Redis 캐시 / 큐 ─────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: hyperlocal_redis_dev
    <<: *restart-policy
    command: >
      redis-server
      --requirepass dev_redis_password
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hyperlocal_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  # ── MinIO (S3 호환 로컬 스토리지) ───────────
  # 미션 인증 사진, 콘텐츠 파일 저장용
  minio:
    image: minio/minio:RELEASE.2024-02-06T21-36-22Z
    container_name: hyperlocal_minio_dev
    <<: *restart-policy
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API 엔드포인트
      - "9001:9001"   # 웹 콘솔 (http://localhost:9001)
    networks:
      - hyperlocal_network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging: *default-logging

  # ── 백엔드 API 서버 ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 개발 환경: deps 스테이지까지만 빌드 (빌드 속도 우선)
      target: deps
    image: hyperlocal/backend:dev
    container_name: hyperlocal_backend_dev
    <<: *restart-policy
    # 개발 시 ts-node-dev로 실행 (hot reload)
    command: npm run dev
    environment:
      <<: *common-env
      NODE_ENV: development
      PORT: 4000

      # 데이터베이스
      DATABASE_URL: postgresql://hyperlocal_user:dev_password_change_in_prod@postgres:5432/hyperlocal_dev

      # Redis
      REDIS_URL: redis://:dev_redis_password@redis:6379

      # S3 (MinIO)
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_NAME: hyperlocal-uploads
      S3_REGION: ap-northeast-2

      # JWT (개발용 — 프로덕션에서는 반드시 교체)
      JWT_SECRET: dev-jwt-secret-minimum-32-characters-long
      JWT_EXPIRES_IN: 7d
      REFRESH_TOKEN_EXPIRES_IN: 30d

      # 카카오 로그인 (개발용 키)
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-dev_kakao_client_id}
      KAKAO_REDIRECT_URI: http://localhost:4000/auth/kakao/callback

      # 이메일 (Mailhog 사용)
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    volumes:
      # 소스코드 마운트 (Hot reload)
      - ./backend/src:/app/src:ro
      # 로그 출력 (디버깅)
      - ./logs/backend:/app/logs
      # node_modules는 컨테이너 내부 유지 (성능)
      - backend_node_modules:/app/node_modules
    ports:
      - "4000:4000"
      - "9229:9229"   # Node.js 디버거 포트
    networks:
      - hyperlocal_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    logging: *default-logging

  # ── 프론트엔드 Next.js ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: deps    # 개발: 의존성만 설치된 스테이지
    image: hyperlocal/frontend:dev
    container_name: hyperlocal_frontend_dev
    <<: *restart-policy
    command: npm run dev
    environment:
      <<: *common-env
      NODE_ENV: development
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"

      # API URL (브라우저에서 접근하는 주소)
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_KAKAO_MAP_KEY: ${KAKAO_MAP_KEY:-dev_kakao_map_key}

      # Next.js 개발 서버 설정
      WATCHPACK_POLLING: "true"   # WSL2 파일 감시 이슈 해결
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - frontend_next_cache:/app/.next  # .next 캐시 유지
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    networks:
      - hyperlocal_network
    depends_on:
      - backend
    logging: *default-logging

  # ── Nginx 리버스 프록시 (개발용) ───────────
  nginx:
    image: nginx:1.25-alpine
    container_name: hyperlocal_nginx_dev
    <<: *restart-policy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    networks:
      - hyperlocal_network
    depends_on:
      - frontend
      - backend
    logging: *default-logging

  # ── MailHog (개발용 이메일 테스트) ─────────
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hyperlocal_mailhog_dev
    <<: *restart-policy
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # 웹 UI (http://localhost:8025)
    networks:
      - hyperlocal_network
    logging: *default-logging

  # ── Adminer (DB 웹 클라이언트) ─────────────
  adminer:
    image: adminer:4.8.1
    container_name: hyperlocal_adminer_dev
    <<: *restart-policy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"   # http://localhost:8080
    networks:
      - hyperlocal_network
    depends_on:
      - postgres
    logging: *default-logging

# ─────────────────────────────────────────────
# 볼륨 정의
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    name: hyperlocal_postgres_data_dev
  redis_data:
    name: hyperlocal_redis_data_dev
  minio_data:
    name: hyperlocal_minio_data_dev
  backend_node_modules:
    name: hyperlocal_backend_modules_dev
  frontend_node_modules:
    name: hyperlocal_frontend_modules_dev
  frontend_next_cache:
    name: hyperlocal_frontend_next_cache_dev

# ─────────────────────────────────────────────
# 네트워크 정의
# ─────────────────────────────────────────────
networks:
  hyperlocal_network:
    name: hyperlocal_dev_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
```

