# Docker 컨테이너 설정 파일

## 프로젝트 구조 전제

```
hyperlocal-mission-platform/
├── backend/                 # Node.js/Express API 서버
│   ├── src/
│   ├── package.json
│   └── Dockerfile
├── frontend/               # Next.js 프론트엔드
│   ├── src/
│   ├── package.json
│   └── Dockerfile.frontend
├── nginx/                  # 리버스 프록시
│   ├── nginx.conf
│   └── nginx.prod.conf
├── docker-compose.yml
├── docker-compose.prod.yml
└── .dockerignore
```

---

## 1. Dockerfile (백엔드 - 멀티스테이지 빌드)

```dockerfile
# =============================================================================
# backend/Dockerfile
# Node.js Express API Server - Multi-stage Build
# =============================================================================

# ─────────────────────────────────────────────
# Stage 1: deps — 의존성 설치 전용 레이어
# 패키지 파일만 복사해 캐시 레이어를 최대화
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS deps

# 보안: 취약점이 있는 패키지 업데이트
RUN apk update && apk upgrade --no-cache && \
    apk add --no-cache \
        libc6-compat \   
        dumb-init          

# npm ci를 위한 패키지 파일만 먼저 복사 (캐시 레이어 활용)
WORKDIR /app
COPY package.json package-lock.json ./

# production 의존성만 설치 (devDependencies 제외)
RUN npm ci --only=production && \
    # 캐시 정리로 이미지 크기 최소화
    npm cache clean --force


# ─────────────────────────────────────────────
# Stage 2: builder — TypeScript 컴파일 레이어
# devDependencies 포함해 빌드 수행
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS builder

WORKDIR /app

# 전체 의존성 설치 (devDependencies 포함, 빌드 도구 필요)
COPY package.json package-lock.json ./
RUN npm ci && npm cache clean --force

# 소스 코드 복사 (패키지 이후에 복사해 캐시 미스 최소화)
COPY tsconfig.json ./
COPY src/ ./src/

# TypeScript 컴파일
RUN npm run build && \
    # 불필요한 소스맵 제거 (필요시 주석 해제)
    # find ./dist -name "*.map" -delete && \
    echo "✅ Build completed"


# ─────────────────────────────────────────────
# Stage 3: runner — 최종 실행 이미지
# 컴파일 결과물 + production 의존성만 포함
# ─────────────────────────────────────────────
FROM node:20.11-alpine3.19 AS runner

# 메타데이터 레이블
LABEL maintainer="hyperlocal-team"
LABEL description="HyperLocal Mission Platform - Backend API"
LABEL version="1.0.0"

# 보안 패치 및 최소 필수 패키지만 설치
RUN apk update && apk upgrade --no-cache && \
    apk add --no-cache \
        dumb-init \      
        curl \           
        tzdata && \      
    # 한국 시간대 설정
    cp /usr/share/zoneinfo/Asia/Seoul /etc/localtime && \
    echo "Asia/Seoul" > /etc/timezone && \
    apk del tzdata && \
    # 불필요한 캐시 제거
    rm -rf /var/cache/apk/*

WORKDIR /app

# ── 보안: non-root 사용자 생성 ──────────────
# UID/GID 고정으로 파일 권한 일관성 확보
RUN addgroup \
        --system \
        --gid 1001 \
        nodejs && \
    adduser \
        --system \
        --uid 1001 \
        --ingroup nodejs \
        --no-create-home \
        --shell /bin/false \
        nodeuser

# ── 파일 복사: builder & deps 스테이지에서 가져옴 ──
# 컴파일된 결과물
COPY --from=builder --chown=nodeuser:nodejs /app/dist ./dist

# production 의존성만 (node_modules 전체 복사 방지)
COPY --from=deps --chown=nodeuser:nodejs /app/node_modules ./node_modules

# 패키지 정보 (런타임 버전 확인용)
COPY --chown=nodeuser:nodejs package.json ./

# ── 환경 변수 기본값 설정 ──────────────────
ENV NODE_ENV=production \
    PORT=4000 \
    # Node.js 메모리 제한 (컨테이너 OOM 방지)
    NODE_OPTIONS="--max-old-space-size=512" \
    # 타임존
    TZ=Asia/Seoul

# non-root 사용자로 전환
USER nodeuser

# 포트 노출 (문서화 목적, 실제 바인딩은 compose에서)
EXPOSE 4000

# ── 헬스체크 ───────────────────────────────
# 컨테이너 상태를 Docker/orchestrator가 감지
HEALTHCHECK \
    --interval=30s \
    --timeout=10s \
    --start-period=40s \
    --retries=3 \
    CMD curl -f http://localhost:4000/health || exit 1

# ── 엔트리포인트 ────────────────────────────
# dumb-init: PID 1 좀비 프로세스 방지 + 시그널 핸들링
ENTRYPOINT ["dumb-init", "--"]
CMD ["node", "dist/server.js"]
```

