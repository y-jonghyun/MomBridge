## 4. docker-compose.prod.yml (프로덕션 환경)

```yaml
# =============================================================================
# docker-compose.prod.yml
# 프로덕션 환경 — 보안, 고가용성, 리소스 제한 중심
# 사용법: docker-compose -f docker-compose.prod.yml up -d
# =============================================================================

version: "3.9"

# ── 공통 설정 앵커 ──────────────────────────────────────────────────────────
x-common-env: &common-env
  TZ: Asia/Seoul
  NODE_ENV: production

x-logging: &prod-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"
    labels: "service,environment"

# 프로덕션 재시작 정책
x-restart-policy: &restart-policy
  restart: always

# 공통 보안 설정
x-security-opts: &security-opts
  security_opt:
    - no-new-privileges:true  # 권한 상승 방지
  read_only: true             # 파일시스템 읽기 전용

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL (프로덕션) ───────────────────
  postgres:
    image: postgres:16.2-alpine
    container_name: hyperlocal_postgres_prod
    <<: [*restart-policy, *security-opts]
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
      # read_only 모드에서 PostgreSQL 임시 파일 경로
      - /tmp/postgres:/tmp
    networks:
      - backend_network
    # !! 프로덕션: 포트 외부 노출 금지 !!
    # ports: 제거 — 내부 네트워크만 통신
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # 리소스 제한 (OOM 방지)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging: *prod-logging

  # ── Redis (프로덕션) ────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: hyperlocal_redis_prod
    <<: [*restart-policy, *security-opts]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --bind 0.0.0.0
      --protected-mode yes
      --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 640M
        reservations:
          cpus: "0.1"
          memory: 256M
    logging: *prod-logging

  # ── 백엔드 API (프로덕션) ───────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # 프로덕션: 전체 빌드 (runner 스테이지)
      target: runner
      args:
        NODE_ENV: production
    image: hyperlocal/backend:${IMAGE_TAG:-latest}
    container_name: hyperlocal_backend_prod
    <<: [*restart-policy, *security-opts]
    environment:
      <<: *common-env
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ap-northeast-2
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1d
      REFRESH_TOKEN_EXPIRES_IN: 14d
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    # read_only 모드에서 쓰기 가능 임시 디렉토리
    tmpfs:
      - /tmp:mode=1777,size=64m
    volumes:
      - backend_logs:/app/logs
    networks:
      - backend_network
      - frontend_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      # 무중단 배포: 2개 레플리카
      replicas: 2
      update_config:
        parallelism: 1          # 1개씩 순차 업데이트
        delay: 10s              # 업데이트 간 대기
        failure_action: rollback
        order: start-first      # 새 컨테이너 시작 후 구버전 종료
      rollback_config:
        parallelism: 1
        delay: 5s
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *prod-logging

  # ── 프론트엔드 Next.js (프로덕션) ──────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_KAKAO_MAP_KEY: ${NEXT_PUBLIC_KAKAO_MAP_KEY}
    image: hyperlocal/frontend:${IMAGE_TAG:-latest}
    container_name: hyperlocal_frontend_prod
    <<: [*restart-policy, *security-opts]
    environment:
      <<: *common-env
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
    tmpfs:
      - /tmp:mode=1777,size=32m
    networks:
      - frontend_network
    depends_on:
      - backend
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *prod-logging

  # ── Nginx (프로덕션 — SSL 종료, 로드밸런싱) ─
  